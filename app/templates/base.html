<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
  />

  <title>{% block title %}Metro Future{% endblock %}</title>

  <style>

    /* ===== ФОН ===== */

    body {
      position: relative;
      background-image: url("{{ url_for('static', filename=background_image) }}");
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
      margin: 0;
      padding: 0;
      padding-top: 80px; /* чтобы контент не залезал под navbar */
      font-family: sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      z-index: 0;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    /* ===== NAVBAR ===== */

    .navbar {
      display:flex;
      align-items: center;
      background: transparent;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 15px 30px;
      transition: background 0.3s;
    }

    .navbar.scrolled {
      background: rgba(0,0,0,0.8);
    }

    .navbar-brand img {
      height: 50px;
      width: 50px;
      object-fit: cover;
      border-radius: 50%;
      opacity: 0.9;
      transition: 0.3s;
    }

    .navbar-brand img:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    .nav-link {
      color: rgba(255,255,255,0.7) !important;
      font-size: 18px;
      margin: 0 15px;
      transition: 0.3s;
    }

    .nav-link:hover {
      color: white !important;
    }

    .nav-link.active {
      color: white !important;
      border-bottom: 2px solid white;
      font-weight: 600;
    }

    .navbar-toggler {
      border-color: white;
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    .dropdown-menu {
      background: rgba(0,0,0,0.9);
      border: none;
    }

    .dropdown-item {
      color: white;
    }

    .dropdown-item:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* ===== HERO ===== */

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-content {
      color: white;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 600;
    }

    .hero p {
      font-size: 20px;
      margin-top: 15px;
    }

    .hero-buttons {
      margin-top: 30px;
    }

    .hero-buttons .btn {
      padding: 12px 30px;
      font-size: 16px;
      margin: 10px;
      border-radius: 6px;
    }

    /* ===== КОНТЕНТ ===== */

    .container {
      color: white;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    /* ===== MAP ===== */

    .two-columns {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .column {
      flex: 1;
      font-size: large;
    }

    .my-custom-select {
      padding: 0.3rem 1rem;
      width: 300px;
    }

    @media (max-width: 600px) {
      .two-columns {
        flex-direction: column;
      }
    }

  </style>
</head>

<body>

  <!-- ===== NAVBAR ===== -->

  <nav class="navbar navbar-expand-sm navbar-dark">

    <a class="navbar-brand" href="/">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="logo">
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navbar"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-start" id="navbar">

      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            Домой
          </a>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle {% if '/map' in request.path %}active{% endif %}"
            href="#"
            data-toggle="dropdown"
          >
            Карта станций
          </a>

          <div class="dropdown-menu">
            <a class="dropdown-item" href="/map/Nizhny-Novgorod">
              Нижний Новгород
            </a>
          </div>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.path == '/info' %}active{% endif %}" href="/info">
            О проекте
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.path == '/contacts' %}active{% endif %}" href="/contacts">
            Контакты
          </a>
        </li>

      </ul>

    </div>

  </nav>

  <!-- HERO -->
  {% block hero %}{% endblock %}

  <!-- CONTENT -->
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <!-- JS -->

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

  <!-- затемнение navbar при скролле -->
  <script>
    window.addEventListener('scroll', function () {
      const nav = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });
  </script>

</body>
</html>
